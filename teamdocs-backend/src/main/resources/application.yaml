# 端口配置
server:
  port: 8080

# Spring配置
spring:
  application:
    name: teamdocs-backend
  servlet:
    multipart:
      # 容器上限需 ≥ 业务上限；头像业务限制 2MB，文档限制 100MB
      max-file-size: 100MB
      max-request-size: 105MB
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      # ES 由可降级的 ChunkIndex 管理，避免 Boot 再创建一套 localhost 客户端及强依赖健康检查。
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:teamdocs}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

# Mybatis Plus
# XML位置配置
mybatis-plus:
  mapper-locations: classpath*:/asia/creat/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000 # 七天

# Minio
minio:
  endpoint: ${MINIO_ENDPOINT}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT}}
  region: ${MINIO_REGION:us-east-1}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-public: ${MINIO_BUCKET_PUBLIC}
  bucket-private: ${MINIO_BUCKET_PRIVATE}

# Health check
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never

# Agent
teamdocs:
  agent:
    enabled: ${AGENT_ENABLED:false}
    base-url: ${AGENT_BASE_URL:}
    api-key: ${AGENT_API_KEY:}
    model-name: ${AGENT_MODEL_NAME:}
    timeout-seconds: ${AGENT_TIMEOUT_SECONDS:60}
    allow-document-egress: ${AGENT_ALLOW_DOCUMENT_EGRESS:false}
    input-price-per-million: ${AGENT_INPUT_PRICE_PER_MILLION:}
    output-price-per-million: ${AGENT_OUTPUT_PRICE_PER_MILLION:}
    daily-budget: ${AGENT_DAILY_BUDGET:}
  parse:
    enabled: ${PARSE_ENABLED:true}
    max-bytes: ${PARSE_MAX_BYTES:10485760}
    max-chars: ${PARSE_MAX_CHARS:200000}
    timeout-seconds: ${PARSE_TIMEOUT_SECONDS:120}
    retry-delay-seconds: ${PARSE_RETRY_DELAY_SECONDS:5}
    chunk-size: 1000
    chunk-overlap: 120
    batch-size: 5
    pool-size: 2
    scan-delay-ms: 5000
  retrieval:
    search-limit: 6
    read-limit: 20
    max-chars: 4000
  elasticsearch:
    enabled: ${ES_ENABLED:false}
    url: ${ES_URL:http://localhost:9200}
    index: ${ES_INDEX:teamdocs-chunks}
