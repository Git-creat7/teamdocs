# 端口配置
server:
  port: 8080

# Spring配置
spring:
  application:
    name: teamdocs-backend
  servlet:
    multipart:
      # 容器上限需 ≥ 业务上限；头像业务限制 2MB，文档限制 100MB
      max-file-size: 100MB
      max-request-size: 105MB
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:teamdocs}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

# Mybatis Plus
# XML位置配置
mybatis-plus:
  mapper-locations: classpath*:/asia/creat/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000 # 七天

# Minio
minio:
  endpoint: ${MINIO_ENDPOINT}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT}}
  region: ${MINIO_REGION:us-east-1}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-public: ${MINIO_BUCKET_PUBLIC}
  bucket-private: ${MINIO_BUCKET_PRIVATE}

# Health check
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
