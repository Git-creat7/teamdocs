name: teamdocs

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    command:
      - --ngram-token-size=2
      - --innodb-ft-enable-stopword=OFF
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${DB_NAME:-teamdocs}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7.0-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-09-20T22-49-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-teamdocsadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_REGION_NAME: ${MINIO_REGION:-us-east-1}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOWED_ORIGIN:?MINIO_CORS_ALLOWED_ORIGIN is required}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-29000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-29001}:9001"
    volumes:
      - minio_data:/data
    logging: *default-logging
    restart: unless-stopped

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-teamdocsadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC:-teamdocs-public}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE:-teamdocs-private}
    entrypoint:
      - /bin/sh
      - -c
      - |
          set -eu
          attempt=1
          max_attempts=60
          until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
            if [ "$${attempt}" -ge "$${max_attempts}" ]; then
              echo "MinIO 在 $${max_attempts} 次重试后仍未就绪" >&2
              exit 1
            fi
            attempt=$$((attempt + 1))
            sleep 2
          done
          mc mb --ignore-existing "local/$${MINIO_BUCKET_PUBLIC}"
          mc mb --ignore-existing "local/$${MINIO_BUCKET_PRIVATE}"
          mc anonymous set download "local/$${MINIO_BUCKET_PUBLIC}"
    logging: *default-logging
    restart: "no"

  elasticsearch:
    image: ${IMAGE_REPOSITORY:-ghcr.io/git-creat7/teamdocs}/elasticsearch:${IMAGE_TAG:?IMAGE_TAG must be a published commit SHA}
    build:
      context: ./docker/elasticsearch
      dockerfile: Dockerfile
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1536m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    # 仅容器网络可访问；不将未启用认证的 9200 暴露给宿主机或公网。
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped

  milvus-etcd:
    profiles: [semantic]
    image: quay.io/coreos/etcd:v3.5.25
    command: etcd --advertise-client-urls=http://milvus-etcd:2379 --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - milvus_etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  milvus-storage:
    profiles: [semantic]
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MILVUS_STORAGE_USER:-teamdocs-vector}
      MINIO_ROOT_PASSWORD: ${MILVUS_STORAGE_PASSWORD:-vector-local-change-me}
    # 专用对象存储不映射宿主机端口，不复用业务 MinIO。
    volumes:
      - milvus_storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  milvus:
    profiles: [semantic]
    image: milvusdb/milvus:v3.0.2
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-storage:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_STORAGE_USER:-teamdocs-vector}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_STORAGE_PASSWORD:-vector-local-change-me}
      MINIO_REGION: us-east-1
    ports:
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${MILVUS_HEALTH_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    mem_limit: ${MILVUS_MEMORY_LIMIT:-4g}
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  backend:
    image: ${IMAGE_REPOSITORY:-ghcr.io/git-creat7/teamdocs}/backend:${IMAGE_TAG:?IMAGE_TAG must be a published commit SHA}
    build:
      context: ./teamdocs-backend
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-teamdocs}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT is required}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-teamdocsadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC:-teamdocs-public}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE:-teamdocs-private}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-60}
      AGENT_STREAMING: ${AGENT_STREAMING:-true}
      MCP_STEP_URL: ${MCP_STEP_URL:-}
      MCP_STEP_API_KEY: ${MCP_STEP_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-10}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-10}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_TIMEOUT_SECONDS: ${VISION_TIMEOUT_SECONDS:-20}
      VISION_MAX_IMAGES: ${VISION_MAX_IMAGES:-8}
      VISION_MAX_IMAGE_BYTES: ${VISION_MAX_IMAGE_BYTES:-2097152}
      VISION_MAX_PIXELS: ${VISION_MAX_PIXELS:-16000000}
      VISION_MAX_DIMENSION: ${VISION_MAX_DIMENSION:-1600}
      VISION_MAX_OUTPUT_TOKENS: ${VISION_MAX_OUTPUT_TOKENS:-4096}
      MILVUS_URL: http://milvus:19530
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-teamdocs_qwen3_8b_d1024_v1}
      MILVUS_TIMEOUT_SECONDS: ${MILVUS_TIMEOUT_SECONDS:-3}
      AGENT_INPUT_PRICE_PER_MILLION: ${AGENT_INPUT_PRICE_PER_MILLION:-}
      AGENT_OUTPUT_PRICE_PER_MILLION: ${AGENT_OUTPUT_PRICE_PER_MILLION:-}
      AGENT_DAILY_BUDGET: ${AGENT_DAILY_BUDGET:-}
      ES_ENABLED: ${ES_ENABLED:-true}
      ES_URL: http://elasticsearch:9200
      ES_INDEX: ${ES_INDEX:-teamdocs-chunks}
      PARSE_ENABLED: ${PARSE_ENABLED:-true}
      PARSE_MAX_BYTES: ${PARSE_MAX_BYTES:-10485760}
      PARSE_MAX_CHARS: ${PARSE_MAX_CHARS:-200000}
      PARSE_TIMEOUT_SECONDS: ${PARSE_TIMEOUT_SECONDS:-120}
      PARSE_RETRY_DELAY_SECONDS: ${PARSE_RETRY_DELAY_SECONDS:-5}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

  frontend:
    image: ${IMAGE_REPOSITORY:-ghcr.io/git-creat7/teamdocs}/frontend:${IMAGE_TAG:?IMAGE_TAG must be a published commit SHA}
    build:
      context: ./teamdocs-frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-15173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

volumes:
  milvus_etcd_data:
  milvus_storage_data:
  milvus_data:
  elasticsearch_data:
  mysql_data:
  redis_data:
  minio_data:
