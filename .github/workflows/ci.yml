name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        env:
          DB_PASSWORD: ci-mysql-password
          REDIS_PASSWORD: ci-redis-password
          JWT_SECRET: ci-jwt-secret-with-at-least-32-bytes
          MINIO_SECRET_KEY: ci-minio-password
        run: docker compose --env-file .env.example config --quiet

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: teamdocs-backend/pom.xml

      - name: Run backend tests
        run: mvn -B -ntp -f teamdocs-backend/pom.xml test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: teamdocs-frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: teamdocs-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  publish-images:
    name: Publish Docker images
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set image repository
        id: images
        shell: bash
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./teamdocs-backend
          push: true
          tags: ${{ steps.images.outputs.repository }}/backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./teamdocs-frontend
          push: true
          tags: ${{ steps.images.outputs.repository }}/frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Update latest tags after both images are published
        env:
          IMAGE_REPOSITORY: ${{ steps.images.outputs.repository }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE_REPOSITORY/backend:latest" "$IMAGE_REPOSITORY/backend@$BACKEND_DIGEST"
          docker buildx imagetools create --tag "$IMAGE_REPOSITORY/frontend:latest" "$IMAGE_REPOSITORY/frontend@$FRONTEND_DIGEST"

      - name: Summarize published release
        env:
          IMAGE_REPOSITORY: ${{ steps.images.outputs.repository }}
        run: |
          {
            echo '## Published images'
            echo
            echo "- $IMAGE_REPOSITORY/backend:$GITHUB_SHA"
            echo "- $IMAGE_REPOSITORY/frontend:$GITHUB_SHA"
            echo
            echo "Deploy this release with IMAGE_TAG=$GITHUB_SHA in your .env file."
          } >> "$GITHUB_STEP_SUMMARY"
