name: Mirror MinIO images

# One-time / explicit synchronization only; ordinary CI consumes the GHCR digests.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mirror-minio-images
  cancel-in-progress: false

jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install registry-copy utility
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y skopeo
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and verify pre-fetched mirror archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir transfer
          gh release download minio-mirror-seed-20261004 --repo Git-creat7/teamdocs --pattern '*-linux-amd64.tar' --dir transfer
          cd transfer
          echo '38429bf131562961579cdcdcabe2ea4bd275872416ac2049ee77dd936df4a3da  minio-linux-amd64.tar' | sha256sum --check
          echo '94328a8308faf61b6859828ab3257aea01e4ca0ae2544c18f66ddbc134b0bda3  mc-linux-amd64.tar' | sha256sum --check
          tar -xf minio-linux-amd64.tar
          tar -xf mc-linux-amd64.tar
          echo '648817f3b321ec7a2f86c594ba468fa19eff8ee3ac17a07c03acf7a8a35fda33  minio/manifest.json' | sha256sum --check
          echo 'eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780  mc/manifest.json' | sha256sum --check

      - name: Copy verified manifests and layers without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          printf '%s' "$GH_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy --preserve-digests dir:transfer/minio docker://ghcr.io/git-creat7/teamdocs/minio:RELEASE.2024-05-28T17-19-04Z-amd64
          skopeo copy --preserve-digests dir:transfer/mc docker://ghcr.io/git-creat7/teamdocs/mc:RELEASE.2025-08-13T08-35-41Z-amd64

      - name: Verify the exact mirrored digests and binary versions
        run: |
          set -eu
          docker pull ghcr.io/git-creat7/teamdocs/minio@sha256:648817f3b321ec7a2f86c594ba468fa19eff8ee3ac17a07c03acf7a8a35fda33
          docker pull ghcr.io/git-creat7/teamdocs/mc@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780
          docker run --rm --entrypoint minio ghcr.io/git-creat7/teamdocs/minio@sha256:648817f3b321ec7a2f86c594ba468fa19eff8ee3ac17a07c03acf7a8a35fda33 --version | grep 'RELEASE.2024-05-28T17-19-04Z'
          docker run --rm --entrypoint mc ghcr.io/git-creat7/teamdocs/mc@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780 --version | grep 'RELEASE.2025-08-13T08-35-41Z'
          echo 'Mirrored images preserve the pinned linux/amd64 manifest digests; no storage containers were deployed.' >> "$GITHUB_STEP_SUMMARY"
