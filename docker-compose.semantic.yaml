name: teamdocs

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    command: etcd --advertise-client-urls=http://milvus-etcd:2379 --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - milvus_etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  milvus-storage:
    image: ghcr.io/git-creat7/teamdocs/minio@sha256:648817f3b321ec7a2f86c594ba468fa19eff8ee3ac17a07c03acf7a8a35fda33
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MILVUS_STORAGE_USER:-teamdocs-vector}
      MINIO_ROOT_PASSWORD: ${MILVUS_STORAGE_PASSWORD:-vector-local-change-me}
    # 专用对象存储不映射宿主机端口，不复用业务 MinIO。
    volumes:
      - milvus_storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v3.0.2
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-storage:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_STORAGE_USER:-teamdocs-vector}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_STORAGE_PASSWORD:-vector-local-change-me}
      MINIO_REGION: us-east-1
    ports:
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${MILVUS_HEALTH_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    mem_limit: ${MILVUS_MEMORY_LIMIT:-4g}
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

volumes:
  milvus_etcd_data:
  milvus_storage_data:
  milvus_data:
